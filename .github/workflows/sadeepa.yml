name: Cross-Platform Build

on:
  push:
    branches:
      - sadeepa/feature/build-actions
    tags:
      - 'v1.1'  # Triggers on any tag push

jobs:
  build_on_windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Node.js dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: windows-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            windows-node-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --prefer-offline --legacy-peer-deps || exit 0  # Error handlin

      - name: Build the Package
        run: npm run package

      - name: Find and Upload Windows Artifact
        run: |
          echo "Finding Windows installer..."
          $file = Get-ChildItem -Path release/build/ -Filter "*.exe" | Select-Object -ExpandProperty FullName
          echo "Found: $file"
          echo "FILE_PATH=$file" >> $GITHUB_ENV
        shell: pwsh

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ env.FILE_PATH }}
          overwrite: true

  build_on_ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Node.js dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ubuntu-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ubuntu-node-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --prefer-offline --legacy-peer-deps

      - name: Build the Package
        run: npm run package

      - name: Find and Upload Ubuntu Artifact
        run: |
          echo "Finding Ubuntu installer..."
          FILE_PATH=$(find release/build/ -name "*.AppImage" -print -quit)
          echo "Found: $FILE_PATH"
          echo "FILE_PATH=$FILE_PATH" >> $GITHUB_ENV

      - name: Upload Ubuntu Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-installer
          path: ${{ env.FILE_PATH }}
          overwrite: true

  build_on_mac:
    runs-on: macOS-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Node.js dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: mac-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            mac-node-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --prefer-offline --legacy-peer-deps

      - name: Build the Package
        run: npm run package

      - name: Find and Upload macOS Artifact
        run: |
          echo "Finding macOS installer..."
          FILE_PATH=$(find release/build/ -name "*.dmg" -print -quit)
          echo "Found: $FILE_PATH"
          echo "FILE_PATH=$FILE_PATH" >> $GITHUB_ENV

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: ${{ env.FILE_PATH }}
          overwrite: true
